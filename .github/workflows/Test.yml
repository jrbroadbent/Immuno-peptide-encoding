name: Test
run-name: Test core functionality before merging pull request
on: [pull_request]
jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7 # checkout what? the repo in pull request? The repo in pull request merged with main branch?
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.3'  # specify exact version I used (can expand to support other versions later)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest
    - name: Create encoded datasets
      run: |
        python -m benchmark.encoders.OHE
        python -m benchmark.encoders.AAindex_pca
        python -m benchmark.encoders.ESM
    - name: Run tests with pytest
      run: |
        echo "running pytest tests in benchmark/tests/"
        pytest ${{ github.workspace }}/benchmark/tests/test_main.py
        pytest ${{ github.workspace }}/benchmark/tests/test_model_defs.py

# what happens to the pytest output when running it on the virtual machine? 
# the output of all commands in the workflow are shown in GitHub under the relevant step name
